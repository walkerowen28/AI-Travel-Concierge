apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  OPENAI_MODEL: gpt-4.1-mini
  CORS_ORIGINS: http://localhost:8090,http://127.0.0.1:8090
---
# Demo-only credentials, matching docker-compose.yml. Real secrets (OPENAI_API_KEY)
# are created from .env by `make k8s-secret` and never committed.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: travel_concierge
