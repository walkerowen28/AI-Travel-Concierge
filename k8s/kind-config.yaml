kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: travel
nodes:
  - role: control-plane
    # Kubernetes 1.35+ refuses to run on cgroup v1, which older Docker Desktop still uses.
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    extraPortMappings:
      # web Service NodePort -> http://localhost:8090 (Compose keeps 8080).
      - containerPort: 30080
        hostPort: 8090
        protocol: TCP
