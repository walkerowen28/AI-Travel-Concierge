server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same contract as the Vite dev proxy: browser calls /api/..., FastAPI sees the path without that prefix.
    # The Kubernetes Service (or Compose service) for the API must be named "api".
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
